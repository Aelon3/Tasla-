<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Tasla Quick Browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--ink:#0a1a3a;--g1:rgba(255,255,255,.7);--g2:rgba(255,255,255,.28);--edge:rgba(255,255,255,.9);--card:rgba(255,255,255,.55);--acc:#1a6dff;--sh:0 16px 50px rgba(40,90,200,.2);--hi:#fff;--bg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eaf1ff;--g1:rgba(40,40,46,.7);--g2:rgba(20,20,24,.5);--edge:rgba(255,255,255,.14);--card:rgba(255,255,255,.07);--sh:0 16px 50px #000;--hi:rgba(255,255,255,.18);--bg:#000}}
:root[data-theme="dark"]{--ink:#eaf1ff;--g1:rgba(40,40,46,.7);--g2:rgba(20,20,24,.5);--edge:rgba(255,255,255,.14);--card:rgba(255,255,255,.07);--sh:0 16px 50px #000;--hi:rgba(255,255,255,.18);--bg:#000}
html,body{height:100%;margin:0;max-width:100vw;overflow-x:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg) center/cover fixed;overflow:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;transition:transform .15s,background .2s}button:active{transform:scale(.9)}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.on .i.s,.i.s.on{fill:currentColor}
#blobs{position:fixed;inset:0;overflow:hidden;z-index:0}
#blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:fl 14s ease-in-out infinite alternate}
#blobs i:nth-child(1){width:46vmax;height:46vmax;left:-10%;top:-12%;background:#8cc4ff}
#blobs i:nth-child(2){width:38vmax;height:38vmax;right:-8%;top:20%;background:#b9a8ff;animation-delay:-5s}
#blobs i:nth-child(3){width:34vmax;height:34vmax;left:25%;bottom:-18%;background:#7fe3ff;animation-delay:-9s}

.g{position:relative;background:linear-gradient(135deg,var(--g1),var(--g2));backdrop-filter:blur(28px) saturate(1.9);-webkit-backdrop-filter:blur(28px) saturate(1.9);border:1px solid var(--edge);box-shadow:inset 0 1.5px 1px var(--hi),inset 0 -10px 24px rgba(110,160,255,.12),var(--sh)}
.g::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%) -200% 0/200% 100% no-repeat;opacity:0}
.tile:hover::after,.sheen::after{opacity:1;animation:sw 1.1s ease}
@keyframes sw{to{background-position:200% 0}}
#win{height:100%;display:flex;flex-direction:column;position:relative;z-index:1;transition:all .4s cubic-bezier(.2,1,.3,1);animation:win .8s cubic-bezier(.2,1.2,.3,1) both}

#win.hide{display:none}
#tabs{display:flex;align-items:center;gap:6px;padding:8px;margin:8px 8px 0;border-radius:22px}

.r{background:#ff5f57}.y{background:#febc2e}.gr{background:#28c840}

.tab{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;white-space:nowrap;max-width:170px;font-size:13px;background:var(--card);animation:tin .35s cubic-bezier(.2,1.3,.4,1) both;transition:background .2s}
@keyframes tin{from{opacity:0;transform:translateX(-14px) scale(.8)}}
.tab.on{background:var(--acc);color:#fff;box-shadow:0 6px 18px rgba(26,109,255,.4)}

#pg{position:absolute;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,#4aa3ff,#a78bfa);z-index:5;border-radius:3px}

.lnk{display:block;margin:12px auto 0;font-size:12px;opacity:.6;text-decoration:underline}
.yt{flex:1;display:flex;flex-direction:column;min-height:0;gap:8px}
.yt .row{margin:0 8px}.yt small{margin:0 18px;opacity:.6;font-size:12px}
.yh{margin:auto;text-align:center;opacity:.7;padding:20px}.yp iframe{width:calc(100% - 16px);margin:0 8px;aspect-ratio:16/9;border:0;border-radius:22px;background:#000;display:block}.yr{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:0 8px 8px;align-content:start}.yc{border-radius:20px;overflow:hidden;text-align:left;font-size:13px;line-height:1.35}.yc img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:rgba(0,0,0,.12)}.yc div{padding:9px 12px}.yr .yh{grid-column:1/-1}
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,30,80,.25);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s}

#sc{width:min(520px,100%);max-height:82%;overflow:auto;border-radius:30px 30px 0 0;padding:18px;transform:translateY(60px) scale(.96);transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
.ov.on #sc{transform:none}
:root:not([data-theme="dark"]) #sc{background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(235,243,255,.7))}
.mn{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.mn .i{color:var(--acc)}.mn button:hover .i{color:#fff}
.fr{justify-content:space-between;margin-bottom:8px}
.ai .tb{display:flex;gap:6px;margin-bottom:10px}
.ai .tb button{padding:9px 14px;border-radius:16px;background:var(--card);font-size:13px;display:flex;gap:6px;align-items:center}
.ai .tb .on{background:var(--acc);color:#fff}
#msgs{height:42vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.m{padding:11px 14px;border-radius:18px;max-width:86%;white-space:pre-wrap;font-size:14px;line-height:1.5;background:var(--card);border:1px solid var(--edge);animation:up .35s both}

.row{display:flex;gap:8px;margin-top:8px}
.row input,.pin{flex:1;min-width:0;padding:12px 16px;border-radius:18px;border:1px solid var(--edge);background:var(--card);outline:0}
#aiq{position:fixed;right:14px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:40px;height:40px;border-radius:50%;display:grid;place-items:center;opacity:.14;z-index:20;transition:opacity .3s,transform .3s}
#aiq:hover,#aiq:focus{opacity:1;transform:scale(1.1)}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);transition:opacity .9s,transform .9s}
#splash.out{opacity:0;transform:scale(1.2);pointer-events:none}
#splash>*{position:relative;z-index:1;text-align:center}
#splash h1{font-size:clamp(26px,6vw,48px);margin:0;letter-spacing:-1px;animation:pop 1s cubic-bezier(.2,1.4,.4,1) .2s both}
#splash p{margin:0;opacity:.6;animation:pop 1s .5s both}#splash .row{animation:pop 1s .7s both}
#splash .logo{animation:pop 1s cubic-bezier(.2,1.4,.4,1) both,bob 4s 1s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.8)}}
#dock,#closed{position:fixed;z-index:30;display:none}
#dock{left:50%;bottom:18px;transform:translateX(-50%);padding:12px 20px;border-radius:22px;cursor:pointer;animation:up .5s both}
#closed{inset:0;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);padding:11px 18px;border-radius:16px;background:#0a1a3acc;color:#fff;font-size:13px;z-index:90;display:none;animation:up .3s both}
@media (min-width:820px) and (hover:hover){
body{padding:16px;box-sizing:border-box}
#win{width:min(1180px,100%);height:100%;margin:0 auto;border-radius:28px}
#win.max{width:100%}
#lights{display:flex}#newtab{display:block}.dk{display:grid!important}.mob{display:none!important}
#bar{order:-1;margin:0 8px}#tabs{margin:0 8px 8px;order:-2}
#aiq{bottom:28px}.ov{align-items:center}#sc{border-radius:30px}}
</style></head><body>

<script>
const $=s=>document.querySelector(s);
const S={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const YT="tasla://youtube",INST=["yewtu.be","inv.nadeko.net","invidious.nerdvpn.de"];

let tabs=[],cur=0,nid=1,unl=new Set(),desk=S.g("desk",false),favs=S.g("favs",[]),lk=S.g("locked",[]),name=S.g("name",""),aiHide=S.g("aih",false),chats={med:[],gen:[]},mode="med",yt={q:"",i:0,src:""};

  $("#lok").onclick=()=>{if(hash($("#lpin").value)===S.g("pin",0)){unl.add(h);render()}else toast("Wrong PIN")};return}
 if(t.url===YT)return ytHub(v);

function frame(v,src){
 v.innerHTML=`<div class="fw g"><iframe sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation" allow="fullscreen;autoplay;encrypted-media" allowfullscreen referrerpolicy="no-referrer"></iframe></div>`;

function ytHub(v){
 v.innerHTML=`<div class="yt"><div class="row"><input class="pin" id="yq" placeholder="Search YouTube: type anything" value="${esc(yt.q)}" autocomplete="off"><button class="ok" id="yk" title="API key" style="background:var(--card);color:inherit;box-shadow:none">${ic("lock")}</button></div><div id="yp" class="yp"></div><div id="yr" class="yr"></div></div>`;
 const P=$("#yp"),R=$("#yr");
 const play=id=>{P.innerHTML=`<iframe sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation" allow="fullscreen;autoplay;encrypted-media" allowfullscreen referrerpolicy="no-referrer" src="https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1&playsinline=1&autoplay=1"></iframe>`;P.scrollIntoView({behavior:"smooth"})};
 const show=l=>{R.innerHTML=l.length?l.map(x=>`<button class="yc g" data-v="${esc(x.id)}"><img src="${esc(x.th)}" alt=""><div>${esc(x.t)}<br><small style="opacity:.6">${esc(x.c)}</small></div></button>`).join(""):`<p class="yh">No results.</p>`};
 R.onclick=e=>{const b=e.target.closest("[data-v]");if(b)play(b.dataset.v)};
 async function search(q){
  const J=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.json()},E=encodeURIComponent(q),k=S.g("ytkey","");
  if(k){const d=await J("https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=15&q="+E+"&key="+encodeURIComponent(k));return d.items.map(i=>({id:i.id.videoId,t:i.snippet.title,c:i.snippet.channelTitle,th:i.snippet.thumbnails.medium.url}))}
  const fs=[async()=>{const d=await J("https://pipedapi.kavin.rocks/search?q="+E+"&filter=videos");return d.items.map(i=>({id:(i.url||"").split("=")[1],t:i.title,c:i.uploaderName,th:i.thumbnail}))},async()=>{const d=await J("https://yewtu.be/api/v1/search?q="+E+"&type=video");return d.map(i=>({id:i.videoId,t:i.title,c:i.author,th:"https://i.ytimg.com/vi/"+i.videoId+"/mqdefault.jpg"}))}];
  for(const f of fs){try{const l=await f();if(l.length)return l}catch(e){}}
  throw 0}
 let tm,seq=0;
 $("#yq").oninput=()=>{clearTimeout(tm);const q=$("#yq").value.trim();yt.q=q;if(!q){R.innerHTML="";return}
  tm=setTimeout(async()=>{const n=++seq;R.innerHTML=`<p class="yh">Searching...</p>`;
   try{const l=await search(q);if(n==seq)show(l)}
   catch(e){if(n==seq){R.innerHTML=`<div class="yh"><p>Search is blocked on this Claude link. Open Tasla from your own site (Netlify or GitHub Pages) and search usually works without any key. An API key is only an optional backup.</p><button class="ok" id="yb" style="background:var(--card);color:inherit;box-shadow:none">Optional: add API key</button></div>`;$("#yb").onclick=kb}}},450)};
 const kb=()=>{open(`<h3 style="margin-top:0">YouTube API key</h3><ol style="font-size:13px;opacity:.8;padding-left:18px;line-height:1.7"><li>Open console.cloud.google.com and create a project.</li><li>Enable YouTube Data API v3.</li><li>Create credentials, then API key.</li><li>Restrict the key to your website address, then paste it here.</li></ol><div class="row"><input class="pin" id="kk" placeholder="API key" value="${esc(S.g("ytkey",""))}"><button class="ok" id="ko">Save</button></div>`);$("#ko").onclick=()=>{S.s("ytkey",$("#kk").value.trim());shut();toast("Saved");if(yt.q)$("#yq").oninput()}};$("#yk").onclick=kb;
 if(yt.q)$("#yq").oninput()}
function home(v){

$("#view").onclick=e=>{const b=e.target.closest("[data-u]");if(!b)return;const u=b.dataset.u;u[0]=="@"?ai(u.slice(1)):go(u)};

$("#newtab").onclick=$("#pl").onclick=()=>newTab();

const open=h=>{sc.innerHTML=h;sh.classList.add("on")},shut=()=>sh.classList.remove("on");
sh.onclick=e=>{if(e.target===sh)shut()};

 open(`<div class="mn">${[["dark","moon","Dark mode: "+(dark()?"on":"off")],["desk","desk","Desktop site: "+(desk?"on":"off")],["favs","star","Favourites"],["lock","lock",L?"Unlock this site":"Lock this site"],["med","med","Medical AI chat"],["gen","spark","AI assistant"],["bg","img","Change background"],["nobg","reload","Reset background"],["ext","ext","Open outside Tasla"],["aiv","eye","Show or hide AI icon"]].map(x=>`<button data-a="${x[0]}">${ic(x[1])}${x[2]}</button>`).join("")}</div>`)}

function askPin(title,cb){open(`<h3 style="margin-top:0">${title}</h3><div class="row"><input class="pin" id="pp" type="password" inputmode="numeric" placeholder="PIN"><button class="ok" id="po">OK</button></div>`);$("#po").onclick=()=>{const p=$("#pp").value;if(p.length<3)return toast("Use at least 3 digits");cb(p)}}
function lockAct(){const h=host(tabs[cur].url);if(!h)return toast("Open a website first");
 const setL=()=>{lk=isL(h)?lk.filter(x=>x!==h):[...lk,h];S.s("locked",lk);unl.delete(h);shut();toast(isL(h)?"Locked "+h:"Unlocked "+h);render()};
 if(!S.g("pin",0))return askPin("Create a PIN for locked sites",p=>{S.s("pin",hash(p));setL()});
 askPin("Enter your PIN",p=>hash(p)===S.g("pin",0)?setL():toast("Wrong PIN"))}
sc.onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a=="dark"){root.dataset.theme=dark()?"light":"dark";S.s("theme2",root.dataset.theme);menu()}
 else if(a=="desk"){desk=!desk;S.s("desk",desk);shut();render()}
 else if(a=="favs")favList();
 else if(a=="lock")lockAct();
 else if(a=="med"||a=="gen")ai(a);
 else if(a=="bg"){shut();$("#file").click()}
 else if(a=="nobg"){S.s("bg","");applyBg();shut()}
 else if(a=="ext"){const u=tabs[cur].url;u&&u!==YT?window.open(u,"_blank","noopener"):toast("Open a website first")}
 else if(a=="aiv"){aiHide=!aiHide;S.s("aih",aiHide);$("#aiq").style.display=aiHide?"none":"";shut()}

const INS={med:"You are a careful medical information assistant inside a browser app. The user asks about medicines: what a medicine is for, how it is usually taken (with or without food, how often in general terms, how long), who it is for and who should avoid it, common side effects, warnings and interactions. Reply in the same language and script as the user (English, Urdu, or Roman Urdu), in short clear points. Do not give exact numeric doses for children or infants from memory: tell the user to follow the product label or ask a doctor or pharmacist. Always end by advising them to confirm with a doctor or pharmacist before use, and for emergencies to go to a hospital or call local emergency services.",gen:"You are Tasla AI, a helpful, friendly assistant inside a browser app. Answer any question clearly and concisely in the same language and script as the user (English, Urdu, or Roman Urdu)."};
function ai(m){mode=m;
 open(`<div class="ai"><div class="tb"><button data-a="med" class="${m=="med"?"on":""}">${ic("med")}Medical AI</button><button data-a="gen" class="${m=="gen"?"on":""}">${ic("spark")}AI Chat</button></div><div id="msgs"></div><div class="row"><input id="q" placeholder="${m=="med"?"Ask about a medicine...":"Ask me anything..."}"><button class="ok" id="snd">${ic("send")}</button></div></div>`);
 const M=$("#msgs");const bub=(c,t)=>{const d=document.createElement("div");d.className="m "+c;d.textContent=t;M.append(d);M.scrollTop=M.scrollHeight;return d};
 bub("",m=="med"?"Hello! Ask me about any medicine: what it is for, how to take it, and who should or should not use it. I give general information only, not a diagnosis.":"Hello! I am Tasla AI. Ask me anything.");
 chats[m].forEach(x=>bub(x.role=="user"?"u":"",x.content));
 const send=async()=>{const q=$("#q").value.trim();if(!q)return;$("#q").value="";chats[m].push({role:"user",content:q});bub("u",q);const d=bub("","Thinking...");
  try{const sm=window.claude&&await claude.use("sample");if(!sm){d.textContent="AI is not available in this view.";return}
   const msgs=chats[m].map((x,i)=>i==0?{role:x.role,content:INS[m]+"\n\nUser: "+x.content}:x);
   const r=await sm(msgs,{cache:false,onText:o=>{d.textContent=o.text;M.scrollTop=M.scrollHeight}});
   d.textContent=r.text;chats[m].push({role:"assistant",content:r.text})}
  catch(e){chats[m].pop();d.textContent=e&&e.code=="not_granted"?"Permission was not given for AI.":"AI is busy or unavailable. Try again shortly."}};
 $("#snd").onclick=send;$("#q").onkeydown=e=>{if(e.key=="Enter")send()}}
